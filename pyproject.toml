[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-talk-bridge"
version = "0.2.3"
description = "Drive a local OpenCode instance from Nextcloud Talk via polling — a self-hosted chat bridge for a coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrick Leiverkus" }]
keywords = ["nextcloud", "talk", "opencode", "bridge", "ai", "coding-agent"]
dependencies = [
    # The OCS client lives in the MCP repo and is consumed as a pinned git
    # dependency — never reimplement or vendor it. The repo is public, so CI
    # resolves this anonymously.
    "nextcloud-talk-core @ git+https://github.com/leiverkus/nextcloud-talk-mcp.git@core-v1.0.0#subdirectory=packages/nextcloud-talk-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
opencode-talk-bridge = "opencode_talk_bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/leiverkus/opencode-talk-bridge"
Repository = "https://github.com/leiverkus/opencode-talk-bridge"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_talk_bridge"]

[tool.hatch.metadata]
# Required to allow the direct git reference in dependencies.
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=opencode_talk_bridge --cov-report=term-missing"
