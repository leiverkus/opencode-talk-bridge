[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencode-talk-bridge"
version = "0.2.6"
description = "Drive a local OpenCode instance from Nextcloud Talk via polling — a self-hosted chat bridge for a coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Patrick Leiverkus" }]
keywords = ["nextcloud", "talk", "opencode", "bridge", "ai", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    # The reusable OCS client, published on PyPI from the MCP monorepo.
    # Never reimplement or vendor it; track the 1.x SemVer line.
    "nextcloud-talk-core>=1.0.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
opencode-talk-bridge = "opencode_talk_bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/leiverkus/opencode-talk-bridge"
Repository = "https://github.com/leiverkus/opencode-talk-bridge"

[tool.hatch.build.targets.wheel]
packages = ["src/opencode_talk_bridge"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=opencode_talk_bridge --cov-report=term-missing"
